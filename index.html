<!doctype html>
<html lang="hr">

    <header>

        <!-- gumbi Liga prvaka / Europa liga / Konferencijska liga -->

        <!-- izbornik prikaza (vidljiv samo na desktopu) -->
        <nav class="views topviews" id="topviews"></nav>
      </div>
    </header>

    <!-- ovdje se iscrtava odabrani prikaz -->
    <main class="wrap" id="main"></main>

    <!-- donja navigacija (vidljiva samo na mobitelu) -->
    <nav class="bottomnav" id="bottomnav"></nav>

    <script src="data.js"></script>
    <script src="app.js"></script>
